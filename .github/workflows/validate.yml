name: Validate Targets & Code Syntax

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Python Syntax & Bytecode Compilation Check
        run: |
          uv run python -m py_compile *.py

      - name: Validate FASTA Syntax & Stoichiometry (Dry-Run)
        run: |
          uv run python run_prediction.py --all --dry-run
